<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <h1 class="display-4 fw-bold mb-4">Shopping Cart</h1>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div id="cart-items">
                <!-- Cart items will be loaded here by cart.js -->
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping:</span>
                        <span>Free</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total:</strong>
                        <strong id="cart-total">$0.00</strong>
                    </div>
                    <button class="btn btn-primary w-100 btn-lg" onclick="cart.checkout()">Proceed to Checkout</button>
                    <button class="btn btn-outline-secondary w-100 mt-2" onclick="cart.clearCart()">Clear Cart</button>
                </div>
            </div>
        </div>
    </div>
</div>
